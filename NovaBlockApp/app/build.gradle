plugins {
    id 'com.android.application'
}

android {
    namespace 'com.away23.novablock.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.away23.novablock.mobile'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '1.0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'at.away23.novablock.compat'
    compileSdk 36

    defaultConfig {
        applicationId 'at.away23.novablock.compat'
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName '1.0.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

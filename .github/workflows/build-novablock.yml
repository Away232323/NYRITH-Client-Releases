name: Build Nova Block Android

on:
  push:
    branches: [ main ]
    paths:
      - 'NovaBlockApp/**'
      - '.github/workflows/build-novablock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NovaBlockApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/NovaBlock-1.0.0-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaBlock-unsigned-1.0.0
          path: NovaBlockApp/dist/NovaBlock-1.0.0-unsigned.apk
          if-no-files-found: error
          retention-days: 30

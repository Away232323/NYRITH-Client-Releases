name: Build Nova Block Android

on:
  push:
    branches: [ main ]
    paths:
      - 'NovaBlockApp/**'
      - '.github/workflows/build-novablock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NovaBlockApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare artifact and signing tools
        run: |
          mkdir -p dist/sign-tools/lib
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/NovaBlock-1.0.1-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" dist/sign-tools/zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" dist/sign-tools/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" dist/sign-tools/lib/apksigner.jar
          chmod +x dist/sign-tools/zipalign dist/sign-tools/apksigner

      - name: Upload APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: NovaBlock-build-1.0.1
          path: NovaBlockApp/dist/
          if-no-files-found: error
          retention-days: 30

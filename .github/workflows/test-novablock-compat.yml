name: Test Nova Block 1.0.3 across Android

on:
  push:
    paths:
      - '.github/workflows/test-novablock-compat.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  install-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            arch: x86_64
            label: Android-10
          - api: 30
            arch: x86_64
            label: Android-11
          - api: 33
            arch: x86_64
            label: Android-13
          - api: 35
            arch: x86_64
            label: Android-15
    runs-on: ubuntu-latest
    name: ${{ matrix.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact 1.0.3 unsigned build
        uses: actions/download-artifact@v4
        with:
          name: NovaBlock-build-1.0.1
          run-id: 33258866622
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Inspect and sign APK
        run: |
          set -euxo pipefail
          ls -lah dist
          keytool -genkeypair -v -keystore test-release.jks -storepass TestNovaBlock2026 -keypass TestNovaBlock2026 -alias test -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 3650 -dname "CN=Nova Block Multi Android Test, O=Away23"
          java -jar dist/sign-tools/lib/apksigner.jar sign \
            --ks test-release.jks \
            --ks-key-alias test \
            --ks-pass pass:TestNovaBlock2026 \
            --key-pass pass:TestNovaBlock2026 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out dist/NovaBlock-1.0.3-test.apk \
            dist/NovaBlock-1.0.1-unsigned.apk
          java -jar dist/sign-tools/lib/apksigner.jar verify --verbose --print-certs dist/NovaBlock-1.0.3-test.apk
          unzip -t dist/NovaBlock-1.0.3-test.apk
          sha256sum dist/NovaBlock-1.0.3-test.apk

      - name: Install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euxo pipefail
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb install -r dist/NovaBlock-1.0.3-test.apk
            adb shell pm path at.away23.novablock.compat
            adb shell dumpsys package at.away23.novablock.compat | grep -E 'versionCode|versionName|targetSdk|minSdk' | head -10
            adb shell am start -W -n at.away23.novablock.compat/.MainActivity
            sleep 4
            adb shell pidof at.away23.novablock.compat

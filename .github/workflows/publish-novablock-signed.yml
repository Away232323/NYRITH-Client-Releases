name: Publish signed Nova Block APK

on:
  push:
    branches: [ main ]
    paths:
      - 'NovaBlock/publish/**'
      - '.github/workflows/publish-novablock-signed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact signed APK
        shell: bash
        run: |
          set -euo pipefail
          cat NovaBlock/publish/part00.b64 \
              NovaBlock/publish/part01.b64 \
              NovaBlock/publish/part02.b64 \
              NovaBlock/publish/part03.b64 \
              NovaBlock/publish/part04.b64 \
              NovaBlock/publish/part05.b64 | base64 -d > NovaBlock/NovaBlock-1.0.0.apk
          cp NovaBlock/NovaBlock-1.0.0.apk NovaBlock/NovaBlock-latest.apk
          echo '68dd8d34320ec751714459a74f85c373922a69f9ec08c57120fc245f24ba6ba9  NovaBlock/NovaBlock-1.0.0.apk' | sha256sum -c -
          echo '68dd8d34320ec751714459a74f85c373922a69f9ec08c57120fc245f24ba6ba9  NovaBlock/NovaBlock-latest.apk' | sha256sum -c -

      - name: Commit exact APK files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf NovaBlock/publish
          git config user.name 'Away232323'
          git config user.email 'actions@users.noreply.github.com'
          git add NovaBlock/NovaBlock-1.0.0.apk NovaBlock/NovaBlock-latest.apk NovaBlock/publish || true
          git commit -m 'Fix published Nova Block 1.0.0 APK bytes' || exit 0
          git push origin HEAD:main

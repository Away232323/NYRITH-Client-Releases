name: Fix NYRITH website cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version website assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('href="styles.css"', 'href="styles.css?v=20260808-0216"')
          s = s.replace('src="app.js"', 'src="app.js?v=20260808-0216"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit cache fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No cache update needed."
            exit 0
          fi
          git commit -m "Bust NYRITH website asset cache"
          git push

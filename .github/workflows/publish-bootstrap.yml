name: Publish NYRITH 0.7.5 Public Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-bootstrap.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download NYRITH 0.7.5 build
        env:
          ARTIFACT_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-6bfc-81f4-b3cc-4b79581bb2e3/raw?se=2026-08-08T10%3A20%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=5cbf471c-28a6-5acc-9aba-73ba17fe2f13&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T08%3A14%3A09Z&ske=2026-08-09T08%3A14%3A09Z&sks=b&skv=2026-02-06&sig=ZoTUhUnjqHQFy6f%2BjjxO2BbT7DzO2pmvxYrjK5Zly64%3D"
        run: |
          curl --fail --location "$ARTIFACT_URL" --output nyrith.zip
          mkdir release
          unzip -q nyrith.zip -d release
          find release -type f -maxdepth 3 -print

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          mapfile -t files < <(find release -type f \( -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \))
          if [ "${#files[@]}" -lt 3 ]; then
            echo "Expected installer, blockmap and latest.yml"
            exit 1
          fi
          gh release create latest "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "NYRITH Client 0.7.5 Alpha" --notes "NYRITH 0.7.5 polishes the launcher UI: refined NYRITH branding, sidebar icons, top bar, selected-instance stage, news rail, quick-switch cards, Library and Settings styling." --prerelease

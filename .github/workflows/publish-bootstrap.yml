name: Publish NYRITH 0.7.3 Public Release

on:
  push:
    paths:
      - '.github/workflows/publish-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download branded NYRITH build
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-20f8-8246-b649-376dfe7ff388/raw?se=2026-08-08T03%3A02%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=7bc7d1cc-06b5-57e3-bc0d-059209c81c2c&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-07T06%3A49%3A24Z&ske=2026-08-08T06%3A49%3A24Z&sks=b&skv=2026-02-06&sig=tnTDzgJIzRCeC5fq718PjRoPYvoYK4%2Bcv7TlyRxfTUc%3D' -o nyrith.zip
          mkdir -p dist
          unzip -o nyrith.zip -d dist
          ls -lah dist

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete latest --repo '${{ github.repository }}' --cleanup-tag -y || true
          gh release create latest \
            dist/NYRITH-Setup-0.7.3-alpha.1-x64.exe \
            dist/NYRITH-Setup-0.7.3-alpha.1-x64.exe.blockmap \
            dist/latest.yml \
            --repo '${{ github.repository }}' \
            --title 'NYRITH Client 0.7.3 Alpha' \
            --notes 'Branded NYRITH 0.7.3 alpha build with the official NYRITH shield logo. Includes updater metadata for in-client updates.' \
            --prerelease

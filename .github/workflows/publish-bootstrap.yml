name: Publish NYRITH 0.8.4 Matrix + Player Stage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-5c68-8243-a802-3546cd2b73de/raw?se=2026-08-08T12%3A47%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=4d04d193-53a2-5a0a-b799-e0539bb91349&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-08T05%3A56%3A07Z&ske=2026-08-09T05%3A56%3A07Z&sks=b&skv=2026-02-06&sig=7FyYU6eaYvYSQDPpx97ksAV2swTM8FRILClBdYEC0rc%3D"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download NYRITH 0.8.4 build
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o nyrith-build.zip
          mkdir release-files
          unzip -q nyrith-build.zip -d release-files
          find release-files -maxdepth 3 -type f -print
          test -n "$(find release-files -type f -name 'NYRITH-Setup-0.8.4-alpha.1-x64.exe' -print -quit)"
          test -n "$(find release-files -type f -name 'latest.yml' -print -quit)"
          test -n "$(find release-files -type f -name '*.blockmap' -print -quit)"

      - name: Publish rolling latest release
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find release-files -type f -name 'NYRITH-Setup-0.8.4-alpha.1-x64.exe' -print -quit)"
          yml="$(find release-files -type f -name 'latest.yml' -print -quit)"
          blockmap="$(find release-files -type f -name 'NYRITH-Setup-0.8.4-alpha.1-x64.exe.blockmap' -print -quit)"
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest "$exe" "$yml" "$blockmap" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "NYRITH Client 0.8.4 Alpha" \
            --notes "NYRITH 0.8.4 fixes launcher-wide animated FX stacking so Matrix Rain and the other backgrounds are actually visible, and rebuilds the Play player stage with a larger Minecraft-style character focus and overlapping launch dock." \
            --prerelease

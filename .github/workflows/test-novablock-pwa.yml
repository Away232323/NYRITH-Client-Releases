name: Test Nova Block PWA

on:
  push:
    branches: [main]
    paths:
      - 'NovaBlock/**'
      - '.github/workflows/test-novablock-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Pages propagation
        run: sleep 20

      - name: Test standalone PWA shell
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://away232323.github.io/NYRITH-Client-Releases/NovaBlock/'
          curl --retry 8 --retry-delay 3 -fsSL "${BASE}?ci=1" -o index.html
          grep -q 'Nova Studios' index.html
          grep -q 'nova-block-splash.svg' index.html
          grep -q 'game.js?v=3' index.html
          ! grep -q 'chatgpt.site' index.html
          ! grep -qi 'Weiter mit ChatGPT' index.html

      - name: Test PWA assets and manifest
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://away232323.github.io/NYRITH-Client-Releases/NovaBlock/'
          for asset in game.css game.js app-icon.svg nova-studios.svg nova-block-splash.svg manifest.webmanifest sw.js; do
            curl --retry 8 --retry-delay 3 -fsSL "${BASE}${asset}?ci=1" -o "$asset"
            test "$(stat -c%s "$asset")" -gt 100
          done
          grep -q '"name": "Nova Block"' manifest.webmanifest
          grep -q 'app-icon.svg' manifest.webmanifest
          grep -q 'nova-block-pwa-v4' sw.js
          grep -q 'PERFECT CLEAR' game.js
          grep -q "break(lines=1)" game.js
          grep -q 'themeFlash' game.css
          node --check game.js

      - name: Verify no external login dependency
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -RqiE 'chatgpt\.site|oauth|Weiter mit ChatGPT|sign[ -]?in|login' index.html game.js game.css manifest.webmanifest sw.js
          echo 'Nova Block runs standalone without an external login dependency.'

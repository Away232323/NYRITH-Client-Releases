name: Test Nova Block PWA

on:
  push:
    branches: [main]
    paths:
      - 'NovaBlock/**'
      - '.github/workflows/test-novablock-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Pages propagation
        run: sleep 20

      - name: Test V5 shell
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://away232323.github.io/NYRITH-Client-Releases/NovaBlock/'
          curl --retry 8 --retry-delay 3 -fsSL "${BASE}?ci=v5" -o index.html
          grep -q 'game.js?v=5' index.html
          grep -q 'game.css?v=5' index.html
          grep -q 'brandMark' index.html
          grep -q 'RANKING' index.html
          grep -q 'SHOP' index.html
          ! grep -qiE 'chatgpt\.site|Weiter mit ChatGPT' index.html

      - name: Test V5 gameplay fixes
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://away232323.github.io/NYRITH-Client-Releases/NovaBlock/'
          curl --retry 8 --retry-delay 3 -fsSL "${BASE}game.js?v=5&ci=1" -o game.js
          curl --retry 8 --retry-delay 3 -fsSL "${BASE}game.css?v=5&ci=1" -o game.css
          curl --retry 8 --retry-delay 3 -fsSL "${BASE}sw.js?ci=1" -o sw.js
          node --check game.js
          grep -q 'nearestPlacement' game.js
          grep -q 'requestAnimationFrame' game.js
          grep -q 'legacyBest' game.js
          grep -q 'BEST IMPORT' game.js
          grep -q 'profile.runs.push' game.js
          grep -q 'nova-block-pwa-v6' sw.js
          grep -q 'game.js?v=5' sw.js
          grep -q 'contain:layout paint style' game.css

      - name: Verify standalone app
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -RqiE 'chatgpt\.site|oauth|Weiter mit ChatGPT|sign[ -]?in|login' index.html game.js game.css sw.js
          echo 'Nova Block V5 is standalone, rank-migrated and uses magnetic drag.'
